{% extends 'base.html' %} {% block content %}
<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold text-gray-900">Gender List</h2>
  <a
    href="{% url 'add_gender' %}"
    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5"
    >Add Gender</a
  >
</div>

{% if messages %}
<div class="mb-4">
  {% for message in messages %}
  <div
    class="p-4 mb-2 text-sm text-green-800 rounded-lg bg-green-50"
    role="alert"
  >
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}

<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500">
    <thead class="text-xs text-white uppercase bg-blue-600">
      <tr>
        <th scope="col" class="px-6 py-3">ID</th>
        <th scope="col" class="px-6 py-3">Gender</th>
        <th scope="col" class="px-6 py-3">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for gender in genders %}
      <tr class="bg-white border-b hover:bg-gray-50">
        <td class="px-6 py-4 font-medium text-gray-900">
          {{ gender.gender_id }}
        </td>
        <td class="px-6 py-4">{{ gender.gender }}</td>
        <td class="px-6 py-4">
          <a
            href="{% url 'edit_gender' gender.gender_id %}"
            class="font-medium text-blue-600 hover:underline"
            >Edit</a
          >
          |
          <a
            href="{% url 'delete_gender' gender.gender_id %}"
            class="font-medium text-red-600 hover:underline"
            >Delete</a
          >
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
