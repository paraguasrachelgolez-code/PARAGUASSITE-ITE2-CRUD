{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md mt-2">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit User: {{ user.full_name }}</h2>

    {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="p-4 mb-2 text-sm text-red-800 rounded-lg bg-red-50">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'edit_user' user.user_id %}" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="mb-6 flex items-center gap-4">
            {% if user.profile_picture %}
                <img src="{{ user.profile_picture.url }}" class="w-16 h-16 rounded-full object-cover border border-gray-200" alt="Current Profile">
            {% else %}
                <div class="w-16 h-16 rounded-full bg-gray-200 flex items-center justify-center text-gray-500">N/A</div>
            {% endif %}
            <div class="w-full">
                <label class="block mb-2 text-sm font-medium text-gray-900">Change Profile Picture (Optional)</label>
                <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50" type="file" name="profile_picture" accept="image/*">
            </div>
        </div>

        <div class="grid gap-6 mb-6 md:grid-cols-2">
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Full Name</label>
                <input type="text" name="full_name" value="{{ user.full_name }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Email</label>
                <input type="email" name="email" value="{{ user.email }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Gender</label>
                <select name="gender" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" required>
                    {% for g in genders %}
                        <option value="{{ g.gender_id }}" {% if user.gender_id == g.gender_id %}selected{% endif %}>{{ g.gender }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Username</label>
                <input type="text" name="username" value="{{ user.username }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" required>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Birth Date</label>
                <input type="date" name="birth_date" value="{{ user.birth_date|date:'Y-m-d' }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" required>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Contact Number</label>
                <input type="text" name="contact_number" value="{{ user.contact_number }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" required>
            </div>
            <div class="md:col-span-2">
                <label class="block mb-2 text-sm font-medium text-gray-900">Address</label>
                <input type="text" name="address" value="{{ user.address }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" required>
            </div>
        </div>

        <div class="flex justify-end gap-2 mt-4">
            <a href="{% url 'user_list' %}" class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-6 py-2.5">Cancel</a>
            <button type="submit" class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-6 py-2.5">Update User</button>
        </div>
    </form>
</div>
{% endblock %}
