<h2>Delete User</h2>
<p style="color: red;">Are you sure you want to delete this user? This action cannot be undone.</p>

<div style="border: 1px solid #ccc; padding: 20px; width: 350px; margin-bottom: 20px; background-color: #f9f9f9;">
    
    {% if user.profile_picture %}
        <img src="{{ user.profile_picture.url }}" width="150" height="150" style="border-radius: 8px; border: 1px solid #333;"><br><br>
    {% else %}
        <p><i>No profile picture</i></p>
    {% endif %}
    
    <h3 style="margin: 0;">{{ user.full_name }}</h3>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Gender:</strong> {{ user.gender.gender }}</p>
</div>

<form method="POST" action="{% url 'delete_user' user.user_id %}">
    {% csrf_token %}
    <button type="submit" style="color: white; background-color: red; border: none; padding: 8px 15px; cursor: pointer;">Yes, Delete User</button>
    <a href="{% url 'user_list' %}" style="margin-left: 15px; text-decoration: none;">Cancel</a>
</form>
